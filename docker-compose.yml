version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DOCKER_ENV=true
      - DB_TYPE=postgresql
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mindbox-test
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    volumes:
      - ./:/app
    restart: always

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mindbox-test
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data: 